# 本文件是对本机已安装 nav2_bringup/params/nav2_params.yaml 的覆盖。
# navigation.launch.py 深度合并，保留 Humble 的 BT 插件列表和服务器默认配置。
# Humble 的 controller/behavior/smoother cmd_vel 均为 geometry_msgs/msg/Twist。
# 不添加其他 ROS 发行版的 stamped 输出开关来假装完成类型转换。
amcl:
  ros__parameters:
    robot_model_type: nav2_amcl::OmniMotionModel
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    tf_broadcast: true
    laser_min_range: 0.15
    laser_max_range: 12.0
    update_min_d: 0.1
    update_min_a: 0.1
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
controller_server:
  ros__parameters:
    controller_frequency: 20.0
    odom_topic: /odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
      movement_time_allowance: 10.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15
      stateful: true
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      min_vel_x: -0.15
      max_vel_x: 0.20
      min_vel_y: -0.15
      max_vel_y: 0.15
      min_speed_xy: 0.0
      max_speed_xy: 0.25
      min_speed_theta: 0.0
      max_vel_theta: 0.6
      acc_lim_x: 0.4
      acc_lim_y: 0.4
      acc_lim_theta: 1.0
      decel_lim_x: -0.4
      decel_lim_y: -0.4
      decel_lim_theta: -1.0
      vx_samples: 15
      vy_samples: 15
      vtheta_samples: 20
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.03
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: [RotateToGoal, Oscillation, BaseObstacle, GoalAlign, PathAlign, PathDist, GoalDist]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 24.0
      GoalAlign.scale: 16.0
      PathDist.scale: 24.0
      GoalDist.scale: 16.0
      RotateToGoal.scale: 24.0
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      update_frequency: 5.0
      publish_frequency: 2.0
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan: {topic: /scan, data_type: LaserScan, marking: true, clearing: true, obstacle_max_range: 2.5, raytrace_max_range: 3.0, max_obstacle_height: 1.5}
        depth_points: {topic: /camera/depth/points, data_type: PointCloud2, marking: true, clearing: true, min_obstacle_height: 0.05, max_obstacle_height: 1.5, obstacle_max_range: 2.5, raytrace_max_range: 3.0}
      inflation_layer: {plugin: nav2_costmap_2d::InflationLayer, inflation_radius: 0.35, cost_scaling_factor: 3.0}
global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer: {plugin: nav2_costmap_2d::StaticLayer, map_subscribe_transient_local: true}
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan: {topic: /scan, data_type: LaserScan, marking: true, clearing: true, obstacle_max_range: 2.5, raytrace_max_range: 3.0}
        depth_points: {topic: /camera/depth/points, data_type: PointCloud2, marking: true, clearing: true, min_obstacle_height: 0.05, max_obstacle_height: 1.5, obstacle_max_range: 2.5, raytrace_max_range: 3.0}
      inflation_layer: {plugin: nav2_costmap_2d::InflationLayer, inflation_radius: 0.35, cost_scaling_factor: 3.0}
planner_server:
  ros__parameters:
    planner_plugins: [GridBased]
    GridBased: {plugin: nav2_navfn_planner/NavfnPlanner, tolerance: 0.3, use_astar: true, allow_unknown: true}
behavior_server:
  ros__parameters:
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 50.0
    feedback: OPEN_LOOP
    odom_topic: /odom
    max_velocity: [0.20, 0.15, 0.6]
    min_velocity: [-0.15, -0.15, -0.6]
    max_accel: [0.4, 0.4, 1.0]
    max_decel: [-0.4, -0.4, -1.0]
    velocity_timeout: 0.2
